name: Strongplan regression
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '15 2 * * 1'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python engine.py example_site.json --iterations 80 --output cloud_results.json
      - run: python tests/report.py cloud_results.json > validation_report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strongplan-validation
          path: |
            cloud_results.json
            validation_report.md
